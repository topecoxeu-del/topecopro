    const BarChart = ({ className }) => (

    // ============================================
    // HOTELSKE SOBE - TAČAN RASPORED PO SPRATOVIMA
    // ============================================
    const hotelRoomNumbers = {
      1: [101, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 117],
      2: [201, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 217, 219, 220, 221, 222, 223, 224, 225],
      3: [301, 303, 304, 305, 306, 307, 308, 309, 310, 311, 312, 313, 314, 315, 317, 319, 320, 321, 322, 323, 324, 325],
      4: [401, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 417, 419, 420, 421, 422, 423, 424, 425],
      5: [501, 503, 504, 505, 506, 507, 508, 509, 510, 512, 513, 514, 515, 516, 517]
    };

    const generateInitialRooms = () => {
      const rooms = {};
      Object.entries(hotelRoomNumbers).forEach(([floor, roomNumbers]) => {
        roomNumbers.forEach(roomNumber => {
          rooms[roomNumber] = {
            id: roomNumber,
            number: roomNumber.toString(),
            floor: parseInt(floor),
            status: 'pending',
            guestStatus: 'none', // none, abreise, bleibe, bb
            inspected: false, // Hausdame kontrolliert
            inspectedBy: null,
            inspectedAt: null,
            problems: [],
            minibar: {
              water: { consumed: 0, price: 2 },
              cola: { consumed: 0, price: 3 },
              beer: { consumed: 0, price: 5 },
              wine: { consumed: 0, price: 15 },
              snacks: { consumed: 0, price: 4 },
              juice: { consumed: 0, price: 3 }
            },
            photos: [],
            cleanedBy: null,
            completedAt: null
          };
        });
      });
      return rooms;
    };

    // ============================================
    // PERSONAL
    // ============================================
    const staff = [
      { id: 'sobarica1', name: 'Housekeeping 1', pin: '1111', role: 'housekeeper', floors: [1] },
      { id: 'sobarica2', name: 'Housekeeping 2', pin: '2222', role: 'housekeeper', floors: [2] },
      { id: 'sobarica3', name: 'Housekeeping 3', pin: '3333', role: 'housekeeper', floors: [3] },
      { id: 'sobarica4', name: 'Housekeeping 4', pin: '4444', role: 'housekeeper', floors: [4] },
      { id: 'sobarica5', name: 'Housekeeping 5', pin: '5555', role: 'housekeeper', floors: [5] },
      { id: 'hausdame', name: 'Hausdame', pin: '0000', role: 'admin', floors: [1, 2, 3, 4, 5] }
    ];

    const problemTypes = [
      { id: 'damage', label: 'Beschädigung', icon: '🔧' },
      { id: 'missing', label: 'Fehlt', icon: '❓' },
      { id: 'stain', label: 'Fleck', icon: '💧' },
      { id: 'broken', label: 'Defekt', icon: '⚠️' },
      { id: 'dirty', label: 'Schmutzig', icon: '🧹' },
      { id: 'other', label: 'Sonstiges', icon: '📝' }
    ];

    // ============================================
    // GLAVNA APLIKACIJA
    // ============================================
    function HousekeepingApp() {
      const [currentUser, setCurrentUser] = useState(null);
      const [rooms, setRooms] = useState({});
      const [selectedRoom, setSelectedRoom] = useState(null);
      const [activeTab, setActiveTab] = useState('status');
      const [filterFloor, setFilterFloor] = useState(0);
      const [filterStatus, setFilterStatus] = useState('all');
      const [filterGuestStatus, setFilterGuestStatus] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [adminView, setAdminView] = useState('rooms');
      const [isOnline, setIsOnline] = useState(true);

      const today = new Date().toLocaleDateString('de-DE', { 
        weekday: 'long', 
        day: 'numeric', 
        month: 'long',
        year: 'numeric'
      });

      // Firebase sync
      useEffect(() => {
        if (isDemoMode) {
          const savedRooms = localStorage.getItem('housekeeping_hotel_v4');
          if (savedRooms) {
            setRooms(JSON.parse(savedRooms));
          } else {
            setRooms(generateInitialRooms());
          }
          return;
        }

        const roomsRef = database.ref('rooms');
        
        roomsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setRooms(data);
          } else {
            const initialRooms = generateInitialRooms();
            roomsRef.set(initialRooms);
            setRooms(initialRooms);
          }
          setIsOnline(true);
        }, (error) => {
          setIsOnline(false);
        });

        const connectedRef = database.ref('.info/connected');
        connectedRef.on('value', (snap) => {
          setIsOnline(snap.val() === true);
        });

        return () => {
          roomsRef.off();
          connectedRef.off();
        };
      }, []);

      useEffect(() => {
        if (isDemoMode && Object.keys(rooms).length > 0) {
          localStorage.setItem('housekeeping_hotel_v4', JSON.stringify(rooms));
        }
      }, [rooms]);

      const updateRoom = useCallback((roomId, updates) => {
        const updatedRoom = { ...rooms[roomId], ...updates };

        if (isDemoMode) {
          setRooms(prev => ({ ...prev, [roomId]: updatedRoom }));
        } else {
          database.ref(`rooms/${roomId}`).update(updatedRoom);
        }

        if (selectedRoom?.id === roomId) {
          setSelectedRoom(updatedRoom);
        }
      }, [rooms, selectedRoom]);

      const setStatus = useCallback((roomId, status) => {
        const updates = { status };
        if (status === 'clean') {
          updates.completedAt = new Date().toISOString();
          updates.cleanedBy = currentUser?.id;
        }
        if (status === 'in_progress') {
          updates.cleanedBy = currentUser?.id;
        }
        // Reset inspection when status changes
        if (status !== 'clean') {
          updates.inspected = false;
          updates.inspectedBy = null;
          updates.inspectedAt = null;
        }
        updateRoom(roomId, updates);
      }, [currentUser, updateRoom]);

      const setGuestStatus = useCallback((roomId, guestStatus) => {
        if (guestStatus === 'abreise') {
          updateRoom(roomId, { guestStatus, anreise: true });
        } else {
          updateRoom(roomId, { guestStatus, anreise: false });
        }
      }, [updateRoom]);

      const setAnreise = useCallback((roomId, anreise) => {
        updateRoom(roomId, { anreise });
      }, [updateRoom]);

      const setInspected = useCallback((roomId, inspected) => {
        const updates = { 
          inspected,
          inspectedBy: inspected ? currentUser?.id : null,
          inspectedAt: inspected ? new Date().toISOString() : null
        };
        updateRoom(roomId, updates);
      }, [currentUser, updateRoom]);

      const addProblem = useCallback((roomId, problemType, description) => {
        const room = rooms[roomId];
        const newProblem = {
          id: Date.now(),
          type: problemType,
          description,
          reportedBy: currentUser?.id,
          reportedAt: new Date().toISOString()
        };
        updateRoom(roomId, { problems: [...(room.problems || []), newProblem] });
      }, [rooms, currentUser, updateRoom]);

      const updateMinibar = useCallback((roomId, item, delta) => {
        const room = rooms[roomId];
        const newMinibar = { ...room.minibar };
        newMinibar[item] = {
          ...newMinibar[item],
          consumed: Math.max(0, newMinibar[item].consumed + delta)
        };
        updateRoom(roomId, { minibar: newMinibar });
      }, [rooms, updateRoom]);

      const addPhoto = useCallback((roomId, imageData) => {
        const room = rooms[roomId];
        const newPhoto = {
          id: Date.now(),
          url: imageData,
          takenBy: currentUser?.id,
          takenAt: new Date().toISOString()
        };
        updateRoom(roomId, { photos: [...(room.photos || []), newPhoto] });
      }, [rooms, currentUser, updateRoom]);

      const resetDay = useCallback(() => {
        if (confirm('Alle Zimmer zurücksetzen?')) {
          const resetRooms = generateInitialRooms();
          if (isDemoMode) {
            setRooms(resetRooms);
          } else {
            database.ref('rooms').set(resetRooms);
          }
        }
      }, []);

      const generatePDF = useCallback(() => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const dateStr = new Date().toLocaleDateString('de-DE', {
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        
        const timeStr = new Date().toLocaleTimeString('de-DE', {
          hour: '2-digit',
          minute: '2-digit'
        });

        // Header
        doc.setFontSize(20);
        doc.setFont(undefined, 'bold');
        doc.text('Housekeeping Tagesbericht', 105, 20, { align: 'center' });
        
        doc.setFontSize(12);
        doc.setFont(undefined, 'normal');
        doc.text(`Datum: ${dateStr}`, 105, 30, { align: 'center' });
        doc.text(`Erstellt um: ${timeStr}`, 105, 37, { align: 'center' });
        
        // Line
        doc.setLineWidth(0.5);
        doc.line(20, 42, 190, 42);

        // Summary
        doc.setFontSize(14);
        doc.setFont(undefined, 'bold');
        doc.text('Zusammenfassung', 20, 52);
        
        doc.setFontSize(11);
        doc.setFont(undefined, 'normal');
        
        const roomsArr = Object.values(rooms);
        const summaryStats = {
          total: roomsArr.length,
          inspected: roomsArr.filter(r => r.inspected).length,
          clean: roomsArr.filter(r => r.status === 'clean' && !r.inspected).length,
          pending: roomsArr.filter(r => r.status === 'pending').length,
          problems: roomsArr.filter(r => r.problems?.length > 0).length,
          abreise: roomsArr.filter(r => r.guestStatus === 'abreise').length,
          bleibe: roomsArr.filter(r => r.guestStatus === 'bleibe').length,
          bb: roomsArr.filter(r => r.guestStatus === 'bb').length,
          kontrolle: roomsArr.filter(r => r.guestStatus === 'kontrolle').length
        };
        
        doc.text(`Gesamt Zimmer: ${summaryStats.total}`, 20, 62);
        doc.text(`Kontrolliert (fertig): ${summaryStats.inspected}`, 20, 69);
        doc.text(`Sauber (nicht kontrolliert): ${summaryStats.clean}`, 20, 76);
        doc.text(`Ausstehend: ${summaryStats.pending}`, 20, 83);
        doc.text(`Mit Problemen: ${summaryStats.problems}`, 20, 90);
        
        doc.text(`Abreise: ${summaryStats.abreise}`, 110, 62);
        doc.text(`Bleibe: ${summaryStats.bleibe}`, 110, 69);
        doc.text(`BB: ${summaryStats.bb}`, 110, 76);
        doc.text(`Kontrolle: ${summaryStats.kontrolle}`, 110, 83);

        // Line
        doc.line(20, 97, 190, 97);

        // Room list by floor
        let yPos = 107;
        
        doc.setFontSize(14);
        doc.setFont(undefined, 'bold');
        doc.text('Zimmer nach Etage', 20, yPos);
        yPos += 10;

        [1, 2, 3, 4, 5].forEach(floor => {
          const floorRooms = roomsArr.filter(r => r.floor === floor).sort((a, b) => a.id - b.id);
          
          if (yPos > 270) {
            doc.addPage();
            yPos = 20;
          }
          
          doc.setFontSize(12);
          doc.setFont(undefined, 'bold');
          doc.text(`${floor}. Stock`, 20, yPos);
          yPos += 7;
          
          doc.setFontSize(9);
          doc.setFont(undefined, 'normal');
          
          floorRooms.forEach(room => {
            if (yPos > 280) {
              doc.addPage();
              yPos = 20;
            }
            
            const statusText = room.inspected ? 'KONTROLLIERT' : 
                              room.status === 'clean' ? 'Sauber' : 
                              room.status === 'in_progress' ? 'In Bearbeitung' : 'Ausstehend';
            
            const guestText = room.guestStatus === 'abreise' ? 'ABR' :
                             room.guestStatus === 'bleibe' ? 'BL' :
                             room.guestStatus === 'bb' ? 'BB' :
                             room.guestStatus === 'kontrolle' ? 'KO' : '-';
            
            const cleanedByText = room.cleanedBy ? staff.find(s => s.id === room.cleanedBy)?.name || '' : '';
            
            const problemText = room.problems?.length > 0 ? `! ${room.problems.length} Problem(e)` : '';
            
            doc.text(`${room.number}`, 20, yPos);
            doc.text(`[${guestText}]`, 35, yPos);
            doc.text(`${statusText}`, 50, yPos);
            doc.text(`${cleanedByText}`, 95, yPos);
            doc.text(`${problemText}`, 145, yPos);
            
            yPos += 5;
          });
          
          yPos += 5;
        });

        // Problems section
        const roomsWithProblems = roomsArr.filter(r => r.problems?.length > 0);
        if (roomsWithProblems.length > 0) {
          if (yPos > 250) {
            doc.addPage();
            yPos = 20;
          }
          
          doc.setLineWidth(0.5);
          doc.line(20, yPos, 190, yPos);
          yPos += 10;
          
          doc.setFontSize(14);
          doc.setFont(undefined, 'bold');
          doc.text('Gemeldete Probleme', 20, yPos);
          yPos += 10;
          
          doc.setFontSize(10);
          doc.setFont(undefined, 'normal');
          
          roomsWithProblems.forEach(room => {
            room.problems.forEach(problem => {
              if (yPos > 280) {
                doc.addPage();
                yPos = 20;
              }
              
              const typeLabel = problemTypes.find(p => p.id === problem.type)?.label || problem.type;
              doc.text(`Zimmer ${room.number}: ${typeLabel} - ${problem.description}`, 20, yPos);
              yPos += 6;
            });
          });
        }

        // Minibar section
        const roomsWithMinibar = roomsArr.filter(r => {
          const total = Object.values(r.minibar || {}).reduce((sum, item) => sum + item.consumed, 0);
          return total > 0;
        });
        
        if (roomsWithMinibar.length > 0) {
          if (yPos > 250) {
            doc.addPage();
            yPos = 20;
          }
          
          doc.setLineWidth(0.5);
          doc.line(20, yPos, 190, yPos);
          yPos += 10;
          
          doc.setFontSize(14);
          doc.setFont(undefined, 'bold');
          doc.text('Minibar Verbrauch', 20, yPos);
          yPos += 10;
          
          doc.setFontSize(10);
          doc.setFont(undefined, 'normal');
          
          let totalMinibar = 0;
          
          roomsWithMinibar.forEach(room => {
            if (yPos > 280) {
              doc.addPage();
              yPos = 20;
            }
            
            const items = [];
            const roomTotal = Object.entries(room.minibar || {}).reduce((sum, [key, item]) => {
              if (item.consumed > 0) {
                const name = key === 'water' ? 'Wasser' : key === 'cola' ? 'Cola' : key === 'beer' ? 'Bier' : 
                            key === 'wine' ? 'Wein' : key === 'snacks' ? 'Snacks' : key === 'juice' ? 'Saft' : key;
                items.push(`${item.consumed}x ${name}`);
              }
              return sum + (item.consumed * item.price);
            }, 0);
            
            totalMinibar += roomTotal;
            doc.text(`Zimmer ${room.number}: ${items.join(', ')} = ${roomTotal}€`, 20, yPos);
            yPos += 6;
          });
          
          yPos += 4;
          doc.setFont(undefined, 'bold');
          doc.text(`GESAMT MINIBAR: ${totalMinibar}€`, 20, yPos);
        }

        // Footer
        doc.setFontSize(8);
        doc.setFont(undefined, 'italic');
        doc.text('Housekeeping ibis - Tagesbericht', 105, 290, { align: 'center' });

        // Save
        const fileName = `Tagesbericht_${new Date().toISOString().split('T')[0]}.pdf`;
        doc.save(fileName);
      }, [rooms]);

      // BOJE: Žuta/Zlatna = Sauber (Housekeeping), Zelena = Kontrolisano (Hausdame)
      const getStatusColor = (room) => {
        if (room.inspected) return 'bg-emerald-600'; // Hausdame kontrolisala - ZELENO
        switch(room.status) {
          case 'clean': return 'bg-amber-400'; // Sauber - ŽUTA/ZLATNA (Top Eco)
          case 'in_progress': return 'bg-orange-400';
          case 'skipped': return 'bg-slate-400';
          default: return 'bg-slate-200';
        }
      };

      const getStatusBgColor = (room) => {
        if (room.inspected) return 'bg-emerald-50 border-emerald-400';
        switch(room.status) {
          case 'clean': return 'bg-amber-50 border-amber-300';
          case 'in_progress': return 'bg-orange-50 border-orange-200';
          case 'skipped': return 'bg-slate-50 border-slate-200';
          default: return 'bg-white border-slate-100';
        }
      };

      const getStatusLabel = (room) => {
        if (room.inspected) return 'Kontrolliert / Inspected ✓✓';
        switch(room.status) {
          case 'clean': return 'Sauber / Clean ✓';
          case 'in_progress': return 'In Bearbeitung / In Progress';
          case 'skipped': return 'Übersprungen / Skipped';
          default: return 'Ausstehend / Pending';
        }
      };

      const getGuestStatusLabel = (guestStatus) => {
        switch(guestStatus) {
          case 'abreise': return 'Abreise / Check-out';
          case 'bleibe': return 'Bleibe / Stay';
          case 'bb': return 'BB (Bed & Bath)';
          case 'kontrolle': return 'Kontrolle / Check';
          default: return '';
        }
      };

      const getGuestStatusColor = (guestStatus) => {
        switch(guestStatus) {
          case 'abreise': return 'bg-red-100 text-red-700';
          case 'bleibe': return 'bg-blue-100 text-blue-700';
          case 'bb': return 'bg-purple-100 text-purple-700';
          case 'kontrolle': return 'bg-orange-100 text-orange-700';
          default: return '';
        }
      };

      const getStaffName = (staffId) => {
        return staff.find(s => s.id === staffId)?.name || '';
      };

      const roomsArray = Object.values(rooms);
      
      const filteredRooms = roomsArray.filter(room => {
        if (currentUser?.role === 'housekeeper') {
          if (!currentUser.floors.includes(room.floor)) return false;
        }
        if (filterFloor > 0 && room.floor !== filterFloor) return false;
        if (filterStatus !== 'all') {
          if (filterStatus === 'inspected' && !room.inspected) return false;
          if (filterStatus !== 'inspected' && room.status !== filterStatus) return false;
        }
        if (filterGuestStatus !== 'all' && room.guestStatus !== filterGuestStatus) return false;
        if (searchQuery && !room.number.includes(searchQuery)) return false;
        return true;
      }).sort((a, b) => a.id - b.id);

      const stats = {
        total: roomsArray.length,
        clean: roomsArray.filter(r => r.status === 'clean' && !r.inspected).length,
        inspected: roomsArray.filter(r => r.inspected).length,
        inProgress: roomsArray.filter(r => r.status === 'in_progress').length,
        pending: roomsArray.filter(r => r.status === 'pending').length,
        withProblems: roomsArray.filter(r => r.problems?.length > 0).length,
        abreise: roomsArray.filter(r => r.guestStatus === 'abreise').length,
        bleibe: roomsArray.filter(r => r.guestStatus === 'bleibe').length,
        bb: roomsArray.filter(r => r.guestStatus === 'bb').length,
        kontrolle: roomsArray.filter(r => r.guestStatus === 'kontrolle').length
      };

      const staffStats = staff.filter(s => s.role === 'housekeeper').map(s => ({
        ...s,
        cleaned: roomsArray.filter(r => r.cleanedBy === s.id && (r.status === 'clean' || r.inspected)).length,
        inProgress: roomsArray.filter(r => r.cleanedBy === s.id && r.status === 'in_progress').length
      }));

      const availableFloors = currentUser?.role === 'admin' 
        ? [1, 2, 3, 4, 5] 
        : currentUser?.floors || [];

      // LOGIN
      if (!currentUser) {
        return <LoginScreen onLogin={setCurrentUser} isDemoMode={isDemoMode} staff={staff} />;
      }

      // ROOM DETAIL
      if (selectedRoom) {
        return (
          <RoomDetail 
            room={rooms[selectedRoom.id] || selectedRoom}
            currentUser={currentUser}
            onBack={() => setSelectedRoom(null)}
            onSetStatus={setStatus}
            onSetGuestStatus={setGuestStatus}
            onSetAnreise={setAnreise}
            onSetInspected={setInspected}
            onAddProblem={addProblem}
            onUpdateMinibar={updateMinibar}
            onAddPhoto={addPhoto}
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            getStatusColor={getStatusColor}
            getStatusLabel={getStatusLabel}
            getGuestStatusLabel={getGuestStatusLabel}
            getGuestStatusColor={getGuestStatusColor}
            getStaffName={getStaffName}
            problemTypes={problemTypes}
          />
        );
      }

      // MAIN VIEW
      return (
        <div className="min-h-screen bg-slate-50">
          {/* Header */}
          <div className={`${currentUser.role === 'admin' ? 'bg-gradient-to-br from-purple-600 to-purple-700' : 'bg-gradient-to-br from-sky-600 to-sky-700'} text-white px-5 pt-12 pb-6`}>
            <div className="flex items-center justify-between mb-2">
              <div>
                <h1 className="text-xl font-bold">
                  {currentUser.role === 'admin' ? 'Hausdame' : currentUser.name}
                </h1>
                <p className="text-white/70 text-sm">{today}</p>
              </div>
              <div className="flex items-center gap-2">
                <div className={`p-2 rounded-full ${isOnline ? 'bg-white/20' : 'bg-red-500/50'}`}>
                  {isOnline ? <Wifi className="w-4 h-4" /> : <WifiOff className="w-4 h-4" />}
                </div>
                <button onClick={() => setCurrentUser(null)} className="p-2 bg-white/20 rounded-full">
                  <LogOut className="w-4 h-4" />
                </button>
              </div>
            </div>
            
            {/* Stats */}
            <div className="grid grid-cols-4 gap-2 mt-4">
              <div className="bg-white/20 rounded-xl px-2 py-2 text-center">
                <div className="text-xl font-bold">{stats.inspected}</div>
                <div className="text-xs text-white/70">Kontrolliert</div>
              </div>
              <div className="bg-white/20 rounded-xl px-2 py-2 text-center">
                <div className="text-xl font-bold">{stats.clean}</div>
                <div className="text-xs text-white/70">Sauber</div>
              </div>
              <div className="bg-white/20 rounded-xl px-2 py-2 text-center">
                <div className="text-xl font-bold">{stats.inProgress}</div>
                <div className="text-xs text-white/70">In Arbeit</div>
              </div>
              <div className="bg-white/20 rounded-xl px-2 py-2 text-center">
                <div className="text-xl font-bold">{stats.pending}</div>
                <div className="text-xs text-white/70">Übrig</div>
              </div>
            </div>

            {/* Guest Status Stats - Only for Admin */}
            {currentUser.role === 'admin' && (
              <div className="grid grid-cols-4 gap-2 mt-2">
                <div className="bg-red-500/30 rounded-xl px-2 py-2 text-center">
                  <div className="text-xl font-bold">{stats.abreise}</div>
                  <div className="text-xs text-white/70">Abreise</div>
                </div>
                <div className="bg-blue-500/30 rounded-xl px-2 py-2 text-center">
                  <div className="text-xl font-bold">{stats.bleibe}</div>
                  <div className="text-xs text-white/70">Bleibe</div>
                </div>
                <div className="bg-purple-500/30 rounded-xl px-2 py-2 text-center">
                  <div className="text-xl font-bold">{stats.bb}</div>
                  <div className="text-xs text-white/70">BB</div>
                </div>
                <div className="bg-orange-500/30 rounded-xl px-2 py-2 text-center">
                  <div className="text-xl font-bold">{stats.kontrolle}</div>
                  <div className="text-xs text-white/70">Kontrolle</div>
                </div>
              </div>
            )}

            {/* Admin Tabs */}
            {currentUser.role === 'admin' && (
              <div className="flex gap-2 mt-4">
                <button
                  onClick={() => setAdminView('rooms')}
                  className={`flex-1 py-2 rounded-xl text-sm font-medium flex items-center justify-center gap-2 ${
                    adminView === 'rooms' ? 'bg-white text-purple-700' : 'bg-white/20'
                  }`}
                >
                  <Check className="w-4 h-4" /> Zimmer
                </button>
                <button
                  onClick={() => setAdminView('stats')}
                  className={`flex-1 py-2 rounded-xl text-sm font-medium flex items-center justify-center gap-2 ${
                    adminView === 'stats' ? 'bg-white text-purple-700' : 'bg-white/20'
                  }`}
                >
                  <BarChart className="w-4 h-4" /> Statistik
                </button>
              </div>
            )}
          </div>

          {/* Admin Stats */}
          {currentUser.role === 'admin' && adminView === 'stats' && (
            <div className="p-4 space-y-4">
              <div className="bg-white rounded-2xl p-5 shadow-sm">
                <h3 className="font-semibold mb-4">Fortschritt</h3>
                <div className="flex items-center gap-3 mb-2">
                  <div className="flex-1 bg-slate-100 rounded-full h-4 overflow-hidden">
                    <div 
                      className="bg-emerald-600 h-full rounded-full"
                      style={{ width: `${(stats.inspected / stats.total) * 100}%` }}
                    />
                  </div>
                  <span className="font-medium">{Math.round((stats.inspected / stats.total) * 100)}%</span>
                </div>
                <p className="text-slate-500 text-sm">{stats.inspected} von {stats.total} kontrolliert</p>
              </div>

              <div className="bg-white rounded-2xl p-5 shadow-sm">
                <h3 className="font-semibold mb-4">Personal</h3>
                {staffStats.map(s => (
                  <div key={s.id} className="flex items-center justify-between py-3 border-b border-slate-100 last:border-0">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 bg-sky-100 rounded-full flex items-center justify-center text-sky-600 font-bold">
                        {s.name[0]}
                      </div>
                      <div>
                        <p className="font-medium">{s.name}</p>
                        <p className="text-xs text-slate-500">Etage {s.floors.join(', ')}</p>
                      </div>
                    </div>
                    <div className="text-right">
                      <p className="font-bold text-emerald-600">{s.cleaned}</p>
                      <p className="text-xs text-slate-500">fertig</p>
                    </div>
                  </div>
                ))}
              </div>

              <button onClick={generatePDF} className="w-full bg-blue-600 text-white py-3 rounded-xl font-medium flex items-center justify-center gap-2 mb-3">
                <Download className="w-5 h-5" /> Tagesbericht PDF
              </button>

              <button onClick={resetDay} className="w-full bg-rose-500 text-white py-3 rounded-xl font-medium">
                Neuer Tag — Reset
              </button>
            </div>
          )}

          {/* Room List */}
          {(currentUser.role === 'housekeeper' || adminView === 'rooms') && (
            <>
              {/* Search */}
              <div className="px-4 py-3 bg-white border-b border-slate-100 sticky top-0 z-10">
                <div className="relative">
                  <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Zimmer suchen / Search room..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 bg-slate-100 rounded-xl text-sm"
                  />
                </div>
              </div>

              {/* Floor Filter */}
              <div className="flex gap-2 px-4 py-2 overflow-x-auto bg-white border-b border-slate-100">
                <button
                  onClick={() => setFilterFloor(0)}
                  className={`px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap ${
                    filterFloor === 0 ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  Alle
                </button>
                {availableFloors.map(floor => (
                  <button
                    key={floor}
                    onClick={() => setFilterFloor(floor)}
                    className={`px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap ${
                      filterFloor === floor ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600'
                    }`}
                  >
                    {floor}. Stock
                  </button>
                ))}
              </div>

              {/* Status & Guest Status Filter */}
              <div className="flex gap-2 px-4 py-2 overflow-x-auto">
                {[
                  { key: 'all', label: 'Alle / All' },
                  { key: 'pending', label: 'Ausstehend / Pending' },
                  { key: 'clean', label: 'Sauber / Clean' },
                  { key: 'inspected', label: '✓✓ Kontrolliert / Inspected' }
                ].map(filter => (
                  <button
                    key={filter.key}
                    onClick={() => setFilterStatus(filter.key)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${
                      filterStatus === filter.key 
                        ? filter.key === 'inspected' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-white'
                        : 'bg-white text-slate-600 border border-slate-200'
                    }`}
                  >
                    {filter.label}
                  </button>
                ))}
              </div>

              {/* Guest Status Filter - Only for Admin */}
              {currentUser.role === 'admin' && (
                <div className="flex gap-2 px-4 py-2 overflow-x-auto border-b border-slate-100">
                  {[
                    { key: 'all', label: 'Alle / All', color: 'bg-slate-100 text-slate-600' },
                    { key: 'abreise', label: 'Abreise', color: 'bg-red-100 text-red-700' },
                    { key: 'bleibe', label: 'Bleibe', color: 'bg-blue-100 text-blue-700' },
                    { key: 'bb', label: 'BB', color: 'bg-purple-100 text-purple-700' },
                    { key: 'kontrolle', label: 'Kontrolle', color: 'bg-orange-100 text-orange-700' }
                  ].map(filter => (
                    <button
                      key={filter.key}
                      onClick={() => setFilterGuestStatus(filter.key)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${
                        filterGuestStatus === filter.key 
                          ? filter.color + ' ring-2 ring-offset-1 ring-slate-400'
                          : 'bg-white text-slate-600 border border-slate-200'
                      }`}
                    >
                      {filter.label}
                    </button>
                  ))}
                </div>
              )}

              {/* Room Cards */}
              <div className="px-4 pb-24 space-y-2 pt-2">
                {filteredRooms.map(room => (
                  <div
                    key={room.id}
                    className={`w-full rounded-2xl p-3 shadow-sm border ${getStatusBgColor(room)}`}
                  >
                    <div className="flex items-center gap-3">
                      <button
                        onClick={() => setSelectedRoom(room)}
                        className={`w-12 h-12 rounded-xl ${getStatusColor(room)} flex items-center justify-center flex-shrink-0`}
                      >
                        <span className="text-white font-bold">{room.number}</span>
                      </button>
                      
                      {/* Quick buttons for Admin */}
                      {currentUser.role === 'admin' ? (
                        <div className="flex-1">
                          <div className="flex gap-1 mb-1">
                            {[
                              { key: 'abreise', label: 'AB', color: 'bg-red-500 text-white', activeColor: 'ring-2 ring-red-600' },
                              { key: 'bleibe', label: 'BL', color: 'bg-blue-500 text-white', activeColor: 'ring-2 ring-blue-600' },
                              { key: 'bb', label: 'BB', color: 'bg-purple-500 text-white', activeColor: 'ring-2 ring-purple-600' },
                              { key: 'kontrolle', label: 'K', color: 'bg-orange-500 text-white', activeColor: 'ring-2 ring-orange-600' }
                            ].map(btn => (
                              <button
                                key={btn.key}
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setGuestStatus(room.id, room.guestStatus === btn.key ? 'none' : btn.key);
                                }}
                                className={`w-9 h-9 rounded-lg text-xs font-bold ${
                                  room.guestStatus === btn.key 
                                    ? `${btn.color} ${btn.activeColor}` 
                                    : 'bg-slate-200 text-slate-500'
                                }`}
                              >
                                {btn.label}
                              </button>
                            ))}
                            {room.guestStatus === 'abreise' && (
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setAnreise(room.id, !room.anreise);
                                }}
                                className={`w-9 h-9 rounded-lg text-xs font-bold ${
                                  room.anreise 
                                    ? 'bg-green-500 text-white ring-2 ring-green-600' 
                                    : 'bg-white text-slate-300 border-2 border-slate-200'
                                }`}
                              >
                                AN
                              </button>
                            )}
                            {room.status === 'clean' && !room.inspected && (
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setInspected(room.id, true);
                                }}
                                className="w-9 h-9 rounded-lg text-xs font-bold bg-emerald-600 text-white ml-1"
                              >
                                ✓✓
                              </button>
                            )}
                            {room.inspected && (
                              <span className="w-9 h-9 rounded-lg text-xs font-bold bg-emerald-700 text-white ml-1 flex items-center justify-center">
                                ✓✓
                              </span>
                            )}
                          </div>
                          <div className="flex items-center gap-2">
                            <span className={`text-xs ${room.inspected ? 'text-emerald-700 font-medium' : 'text-slate-500'}`}>
                              {getStatusLabel(room)}
                            </span>
                            {room.problems?.length > 0 && (
                              <AlertTriangle className="w-3 h-3 text-amber-600" />
                            )}
                          </div>
                        </div>
                      ) : (
                        <button
                          onClick={() => setSelectedRoom(room)}
                          className="flex-1 text-left"
                        >
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-semibold text-slate-800">Zimmer {room.number}</span>
                            {room.guestStatus !== 'none' && (
                              <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${getGuestStatusColor(room.guestStatus)}`}>
                                {getGuestStatusLabel(room.guestStatus)}
                              </span>
                            )}
                            {room.problems?.length > 0 && (
                              <span className="text-amber-600">
                                <AlertTriangle className="w-4 h-4" />
                              </span>
                            )}
                          </div>
                          <div className="flex items-center gap-2 mt-1">
                            <span className={`text-sm ${room.inspected ? 'text-emerald-700 font-medium' : 'text-slate-500'}`}>
                              {getStatusLabel(room)}
                            </span>
                            {room.cleanedBy && (
                              <span className="text-xs text-slate-400">• {getStaffName(room.cleanedBy)}</span>
                            )}
                          </div>
                        </button>
                      )}
                      
                      <button onClick={() => setSelectedRoom(room)} className="p-1">
                        <ChevronRight className="w-5 h-5 text-slate-300" />
                      </button>
                    </div>
                  </div>
                ))}

                {filteredRooms.length === 0 && (
                  <div className="text-center py-12 text-slate-500">
                    Keine Zimmer gefunden
                  </div>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    // ============================================
    // LOGIN SCREEN
    // ============================================
    function LoginScreen({ onLogin, isDemoMode, staff }) {
      const [selectedStaff, setSelectedStaff] = useState(null);
      const [pin, setPin] = useState('');
      const [error, setError] = useState('');

      const handlePinInput = (digit) => {
        if (pin.length < 4) {
          const newPin = pin + digit;
          setPin(newPin);
          setError('');
          
          if (newPin.length === 4) {
            const user = staff.find(s => s.id === selectedStaff && s.pin === newPin);
            if (user) {
              onLogin(user);
            } else {
              setError('Falscher PIN / Wrong PIN');
              setTimeout(() => setPin(''), 500);
            }
          }
        }
      };

      if (!selectedStaff) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-sky-600 to-purple-700 flex flex-col items-center justify-center p-8">
            <div className="w-32 h-20 bg-white rounded-2xl flex items-center justify-center mb-6 shadow-xl p-2">
              <div className="text-center">
                <div className="text-xl font-bold text-sky-700 leading-tight">TOP ECO</div>
                <div className="text-2xl font-black text-sky-900 leading-tight">ibis</div>
              </div>
            </div>
            <h1 className="text-3xl font-bold text-white mb-2">Housekeeping</h1>
            <p className="text-white/70 mb-8">Wählen Sie Ihren Namen / Select your name</p>

            <div className="w-full max-w-sm space-y-3">
              {staff.map(s => (
                <button
                  key={s.id}
                  onClick={() => setSelectedStaff(s.id)}
                  className="w-full bg-white/20 text-white p-4 rounded-2xl flex items-center gap-4 active:scale-[0.98]"
                >
                  <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold ${
                    s.role === 'admin' ? 'bg-purple-500' : 'bg-sky-500'
                  }`}>
                    {s.name[0]}
                  </div>
                  <div className="flex-1 text-left">
                    <p className="font-semibold">{s.name}</p>
                    <p className="text-sm text-white/70">
                      {s.role === 'admin' ? 'Admin' : `${s.floors.join('. + ')}. Stock`}
                    </p>
                  </div>
                  <ChevronRight className="w-5 h-5 text-white/50" />
                </button>
              ))}
            </div>
          </div>
        );
      }

      const selectedUser = staff.find(s => s.id === selectedStaff);

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-600 to-purple-700 flex flex-col">
          <div className="p-4">
            <button 
              onClick={() => { setSelectedStaff(null); setPin(''); setError(''); }}
              className="text-white/80 flex items-center gap-2"
            >
              <ArrowLeft className="w-5 h-5" /> Zurück
            </button>
          </div>

          <div className="flex-1 flex flex-col items-center justify-center p-8">
            <div className={`w-20 h-20 rounded-full flex items-center justify-center mb-6 text-white text-3xl font-bold ${
              selectedUser.role === 'admin' ? 'bg-purple-500' : 'bg-sky-500'
            }`}>
              {selectedUser.name[0]}
            </div>
            <h2 className="text-2xl font-bold text-white mb-1">{selectedUser.name}</h2>
            <p className="text-white/70 mb-8">PIN eingeben / Enter PIN</p>

            <div className="flex gap-3 mb-6">
              {[0, 1, 2, 3].map(i => (
                <div key={i} className={`w-4 h-4 rounded-full ${i < pin.length ? 'bg-white' : 'bg-white/30'} ${error ? 'bg-rose-400' : ''}`} />
              ))}
            </div>

            {error && <p className="text-rose-300 text-sm mb-4">{error}</p>}

            <div className="grid grid-cols-3 gap-4 w-full max-w-xs">
              {[1, 2, 3, 4, 5, 6, 7, 8, 9, null, 0, 'del'].map((digit, i) => (
                <button
                  key={i}
                  onClick={() => digit === 'del' ? setPin(pin.slice(0, -1)) : digit !== null && handlePinInput(digit.toString())}
                  disabled={digit === null}
                  className={`h-16 rounded-2xl font-bold text-2xl ${
                    digit === null ? 'invisible' : digit === 'del' ? 'bg-white/10 text-white' : 'bg-white/20 text-white active:bg-white/30'
                  }`}
                >
                  {digit === 'del' ? '←' : digit}
                </button>
              ))}
            </div>

            <p className="text-white/50 text-xs mt-8">PIN: {selectedUser.pin}</p>
          </div>
        </div>
      );
    }

    // ============================================
    // ROOM DETAIL
    // ============================================
    function RoomDetail({ 
      room, currentUser, onBack, onSetStatus, onSetGuestStatus, onSetAnreise, onSetInspected, onAddProblem, 
      onUpdateMinibar, onAddPhoto, activeTab, setActiveTab,
      getStatusColor, getStatusLabel, getGuestStatusLabel, getGuestStatusColor, getStaffName, problemTypes
    }) {
      const [problemModal, setProblemModal] = useState(false);
      const [newProblem, setNewProblem] = useState({ type: '', description: '' });
      
      const minibarTotal = Object.entries(room.minibar || {})
        .reduce((sum, [_, item]) => sum + (item.consumed * item.price), 0);

      const formatTime = (isoString) => {
        if (!isoString) return '';
        return new Date(isoString).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      };

      const isAdmin = currentUser.role === 'admin';

      return (
        <div className="min-h-screen bg-slate-50">
          {/* Header */}
          <div className={`${getStatusColor(room)} text-white px-5 pt-12 pb-6`}>
            <button onClick={onBack} className="flex items-center gap-2 text-white/80 mb-4">
              <ArrowLeft className="w-5 h-5" /> Zurück / Back
            </button>
            
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-3xl font-bold">Zimmer {room.number}</h1>
                <p className="text-white/80 mt-1">{room.floor}. Stock • {getStatusLabel(room)}</p>
              </div>
              {room.guestStatus !== 'none' && (
                <span className={`px-3 py-1 rounded-full text-sm font-medium bg-white/20`}>
                  {getGuestStatusLabel(room.guestStatus)}
                </span>
              )}
            </div>
          </div>

          {/* Guest Status - Only for Hausdame */}
          {isAdmin && (
            <div className="px-4 py-3 bg-white border-b border-slate-100">
              <p className="text-xs text-slate-500 mb-2">Gast Status / Guest Status</p>
              <div className="grid grid-cols-5 gap-2">
                {[
                  { key: 'none', label: 'Keine', color: 'bg-slate-200 text-slate-700', ring: 'ring-slate-400' },
                  { key: 'abreise', label: 'Abreise', color: 'bg-red-100 text-red-700', ring: 'ring-red-400' },
                  { key: 'bleibe', label: 'Bleibe', color: 'bg-blue-100 text-blue-700', ring: 'ring-blue-400' },
                  { key: 'bb', label: 'BB', color: 'bg-purple-100 text-purple-700', ring: 'ring-purple-400' },
                  { key: 'kontrolle', label: 'Kontrolle', color: 'bg-orange-100 text-orange-700', ring: 'ring-orange-400' }
                ].map(({ key, label, color, ring }) => (
                  <button
                    key={key}
                    onClick={() => onSetGuestStatus(room.id, key)}
                    className={`py-2 rounded-xl text-xs font-medium ${
                      room.guestStatus === key ? `${color} ring-2 ${ring}` : 'bg-slate-100 text-slate-500'
                    }`}
                  >
                    {label}
                  </button>
                ))}
              </div>
              {room.guestStatus === 'abreise' && (
                <div className="mt-3 flex items-center gap-3">
                  <span className="text-xs text-slate-500">Anreise:</span>
                  <button
                    onClick={() => onSetAnreise(room.id, !room.anreise)}
                    className={`px-4 py-2 rounded-xl text-sm font-bold ${
                      room.anreise 
                        ? 'bg-green-500 text-white' 
                        : 'bg-white text-slate-400 border-2 border-slate-200'
                    }`}
                  >
                    {room.anreise ? 'AN ✓' : 'Prazno'}
                  </button>
                </div>
              )}
            </div>
          )}

          {/* Status Buttons */}
          <div className="px-4 py-3 bg-white border-b border-slate-100">
            <p className="text-xs text-slate-500 mb-2">Reinigung / Cleaning Status</p>
            <div className="grid grid-cols-4 gap-2">
              {[
                { status: 'pending', label: 'Warten', Icon: Clock, ring: 'ring-slate-400', bg: 'bg-slate-200 text-slate-700' },
                { status: 'in_progress', label: 'In Arbeit', Icon: Clock, ring: 'ring-orange-400', bg: 'bg-orange-100 text-orange-700' },
                { status: 'clean', label: 'Sauber', Icon: Check, ring: 'ring-amber-400', bg: 'bg-amber-100 text-amber-700' },
                { status: 'skipped', label: 'Skip', Icon: SkipForward, ring: 'ring-slate-400', bg: 'bg-slate-300 text-slate-700' }
              ].map(({ status, label, Icon, ring, bg }) => (
                <button
                  key={status}
                  onClick={() => onSetStatus(room.id, status)}
                  className={`py-3 rounded-xl text-xs font-medium ${
                    room.status === status && !room.inspected ? `${bg} ring-2 ${ring}` : 'bg-slate-100 text-slate-500'
                  }`}
                >
                  <Icon className="w-5 h-5 mx-auto mb-1" />
                  {label}
                </button>
              ))}
            </div>
          </div>

          {/* Hausdame Kontrolle Button */}
          {isAdmin && room.status === 'clean' && (
            <div className="px-4 py-3 bg-white border-b border-slate-100">
              <button
                onClick={() => onSetInspected(room.id, !room.inspected)}
                className={`w-full py-4 rounded-xl font-semibold text-lg flex items-center justify-center gap-2 ${
                  room.inspected 
                    ? 'bg-emerald-700 text-white' 
                    : 'bg-emerald-100 text-emerald-700 border-2 border-emerald-400'
                }`}
              >
                <Eye className="w-6 h-6" />
                {room.inspected ? '✓✓ Kontrolliert / Inspected' : 'Als Kontrolliert markieren / Mark Inspected'}
              </button>
            </div>
          )}

          {/* Tabs */}
          <div className="flex bg-white border-b border-slate-100">
            {[
              { key: 'status', label: 'Info', IconComp: Check },
              { key: 'problems', label: 'Probleme / Problems', IconComp: AlertTriangle, badge: room.problems?.length || 0 },
              { key: 'minibar', label: 'Minibar', IconComp: Wine },
              { key: 'photos', label: 'Fotos / Photos', IconComp: Camera, badge: room.photos?.length || 0 }
            ].map(tab => (
              <button
                key={tab.key}
                onClick={() => setActiveTab(tab.key)}
                className={`flex-1 py-3 text-sm font-medium flex items-center justify-center gap-1 border-b-2 ${
                  activeTab === tab.key ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-500'
                }`}
              >
                <tab.IconComp className="w-4 h-4" />
                {tab.label}
                {tab.badge > 0 && (
                  <span className="ml-1 px-1.5 py-0.5 bg-rose-500 text-white text-xs rounded-full">{tab.badge}</span>
                )}
              </button>
            ))}
          </div>

          {/* Content */}
          <div className="p-4 pb-24">
            {activeTab === 'status' && (
              <div className="bg-white rounded-2xl p-5 shadow-sm">
                <div className="space-y-3 text-sm">
                  <div className="flex justify-between py-2 border-b border-slate-100">
                    <span className="text-slate-500">Zimmer</span>
                    <span className="font-medium">{room.number}</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-slate-100">
                    <span className="text-slate-500">Etage</span>
                    <span className="font-medium">{room.floor}. Stock</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-slate-100">
                    <span className="text-slate-500">Gast Status</span>
                    <span className={`px-2 py-1 rounded-full text-xs font-medium ${getGuestStatusColor(room.guestStatus) || 'bg-slate-100'}`}>
                      {getGuestStatusLabel(room.guestStatus) || 'Keine'}
                    </span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-slate-100">
                    <span className="text-slate-500">Reinigung</span>
                    <span className="font-medium">{room.status === 'clean' ? 'Sauber' : room.status === 'in_progress' ? 'In Bearbeitung' : 'Ausstehend'}</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-slate-100">
                    <span className="text-slate-500">Kontrolliert</span>
                    <span className={`font-medium ${room.inspected ? 'text-yellow-600' : 'text-slate-400'}`}>
                      {room.inspected ? '✓ Ja' : 'Nein'}
                    </span>
                  </div>
                  {room.cleanedBy && (
                    <div className="flex justify-between py-2 border-b border-slate-100">
                      <span className="text-slate-500">Gereinigt von</span>
                      <span className="font-medium">{getStaffName(room.cleanedBy)}</span>
                    </div>
                  )}
                  {room.completedAt && (
                    <div className="flex justify-between py-2 border-b border-slate-100">
                      <span className="text-slate-500">Fertig um</span>
                      <span className="font-medium text-emerald-600">{formatTime(room.completedAt)}</span>
                    </div>
                  )}
                  {room.inspectedAt && (
                    <div className="flex justify-between py-2">
                      <span className="text-slate-500">Kontrolliert um</span>
                      <span className="font-medium text-yellow-600">{formatTime(room.inspectedAt)}</span>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'problems' && (
              <div className="space-y-4">
                <button
                  onClick={() => setProblemModal(true)}
                  className="w-full bg-rose-500 text-white py-3 rounded-xl font-medium flex items-center justify-center gap-2"
                >
                  <AlertTriangle className="w-5 h-5" /> Problem melden
                </button>

                {(!room.problems || room.problems.length === 0) ? (
                  <div className="bg-white rounded-2xl p-8 text-center">
                    <Check className="w-12 h-12 text-emerald-500 mx-auto mb-3" />
                    <p className="text-slate-500">Keine Probleme</p>
                  </div>
                ) : (
                  room.problems.map(problem => (
                    <div key={problem.id} className="bg-white rounded-xl p-4 shadow-sm flex gap-3">
                      <span className="text-2xl">{problemTypes.find(p => p.id === problem.type)?.icon}</span>
                      <div>
                        <p className="font-medium">{problemTypes.find(p => p.id === problem.type)?.label}</p>
                        <p className="text-sm text-slate-600">{problem.description}</p>
                        <p className="text-xs text-slate-400 mt-1">{formatTime(problem.reportedAt)}</p>
                      </div>
                    </div>
                  ))
                )}

                {problemModal && (
                  <div className="fixed inset-0 bg-black/50 flex items-end z-50">
                    <div className="bg-white w-full rounded-t-3xl p-5 pb-8">
                      <div className="flex justify-between mb-5">
                        <h3 className="text-lg font-semibold">Problem melden</h3>
                        <button onClick={() => setProblemModal(false)}><X className="w-6 h-6 text-slate-400" /></button>
                      </div>

                      <div className="grid grid-cols-3 gap-2 mb-4">
                        {problemTypes.map(type => (
                          <button
                            key={type.id}
                            onClick={() => setNewProblem({ ...newProblem, type: type.id })}
                            className={`py-3 rounded-xl text-center ${
                              newProblem.type === type.id ? 'bg-rose-100 text-rose-700 ring-2 ring-rose-400' : 'bg-slate-100'
                            }`}
                          >
                            <span className="text-xl block mb-1">{type.icon}</span>
                            <span className="text-xs">{type.label}</span>
                          </button>
                        ))}
                      </div>

                      <textarea
                        value={newProblem.description}
                        onChange={(e) => setNewProblem({ ...newProblem, description: e.target.value })}
                        placeholder="Beschreibung..."
                        className="w-full h-20 p-3 bg-slate-100 rounded-xl resize-none"
                      />

                      <button
                        onClick={() => {
                          if (newProblem.type && newProblem.description) {
                            onAddProblem(room.id, newProblem.type, newProblem.description);
                            setNewProblem({ type: '', description: '' });
                            setProblemModal(false);
                          }
                        }}
                        disabled={!newProblem.type || !newProblem.description}
                        className="w-full mt-4 bg-rose-500 text-white py-3 rounded-xl font-medium disabled:opacity-50"
                      >
                        Speichern
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'minibar' && (
              <div className="space-y-4">
                <div className="bg-purple-600 text-white rounded-2xl p-5">
                  <p className="text-purple-200 text-sm">Gesamt</p>
                  <p className="text-3xl font-bold">{minibarTotal} €</p>
                </div>

                <div className="bg-white rounded-2xl divide-y divide-slate-100 shadow-sm">
                  {Object.entries(room.minibar || {}).map(([key, item]) => (
                    <div key={key} className="p-4 flex items-center justify-between">
                      <div>
                        <p className="font-medium">
                          {key === 'water' ? 'Wasser' : key === 'cola' ? 'Cola' : key === 'beer' ? 'Bier' : 
                           key === 'wine' ? 'Wein' : key === 'snacks' ? 'Snacks' : key === 'juice' ? 'Saft' : key}
                        </p>
                        <p className="text-sm text-slate-500">{item.price} €</p>
                      </div>
                      <div className="flex items-center gap-3">
                        <button onClick={() => onUpdateMinibar(room.id, key, -1)} className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center">
                          <Minus className="w-4 h-4" />
                        </button>
                        <span className="w-8 text-center font-semibold text-lg">{item.consumed}</span>
                        <button onClick={() => onUpdateMinibar(room.id, key, 1)} className="w-9 h-9 rounded-full bg-sky-100 flex items-center justify-center">
                          <Plus className="w-4 h-4 text-sky-600" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'photos' && (
              <div className="space-y-4">
                <label className="w-full bg-sky-500 text-white py-3 rounded-xl font-medium flex items-center justify-center gap-2 cursor-pointer">
                  <Camera className="w-5 h-5" /> Foto aufnehmen
                  <input 
                    type="file" 
                    accept="image/*" 
                    capture="environment"
                    className="hidden"
                    onChange={(e) => {
                      const file = e.target.files[0];
                      if (file) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                          onAddPhoto(room.id, reader.result);
                        };
                        reader.readAsDataURL(file);
                      }
                      e.target.value = '';
                    }}
                  />
                </label>

                {(!room.photos || room.photos.length === 0) ? (
                  <div className="bg-white rounded-2xl p-8 text-center">
                    <Camera className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                    <p className="text-slate-500">Keine Fotos</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 gap-2">
                    {room.photos.map(photo => (
                      <div key={photo.id} className="relative aspect-[4/3] rounded-xl overflow-hidden">
                        <img src={photo.url} alt="" className="w-full h-full object-cover" />
                        <div className="absolute bottom-0 left-0 right-0 bg-black/50 p-2">
                          <span className="text-white text-xs">{formatTime(photo.takenAt)}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Complete Button - Only for Housekeeping */}
          {!isAdmin && room.status !== 'clean' && (
            <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100">
              <button
                onClick={() => onSetStatus(room.id, 'clean')}
                className="w-full bg-amber-400 text-slate-800 py-4 rounded-xl font-semibold text-lg flex items-center justify-center gap-2 shadow-lg"
              >
                <Check className="w-6 h-6" /> Sauber / Clean ✓
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HousekeepingApp />);
  </script>
</body>
</html>
