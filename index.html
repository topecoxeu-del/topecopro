<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TopEcoPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // NOVA FIREBASE KONFIGURACIJA
    const firebaseConfig = {
      apiKey: "AIzaSyExample",
      authDomain: "top-eco-app.firebaseapp.com",
      databaseURL: "https://top-eco-app-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "top-eco-app"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const SUPER_ADMIN_PIN = '9999';

    // ==================== MAIN APP ====================
    function App() {
      const [screen, setScreen] = useState('loading');
      const [hotels, setHotels] = useState({});
      const [selectedHotelId, setSelectedHotelId] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);

      useEffect(() => {
        const ref = database.ref('hotels');
        ref.on('value', snap => {
          setHotels(snap.val() || {});
          setScreen('home');
        });
        return () => ref.off();
      }, []);

      if (screen === 'loading') {
        return (
          <div className="min-h-screen bg-emerald-600 flex items-center justify-center">
            <div className="text-white text-center">
              <div className="text-4xl font-bold mb-2">TopEcoPro</div>
              <div>Laden...</div>
            </div>
          </div>
        );
      }

      if (screen === 'admin') {
        return <SuperAdmin hotels={hotels} onBack={() => setScreen('home')} />;
      }

      if (screen === 'app' && selectedHotelId && currentUser) {
        return (
          <HotelApp 
            hotel={hotels[selectedHotelId]} 
            hotelId={selectedHotelId}
            user={currentUser}
            onLogout={() => {
              setCurrentUser(null);
              setSelectedHotelId(null);
              setScreen('home');
            }}
          />
        );
      }

      if (screen === 'login' && selectedHotelId) {
        return (
          <HotelLogin 
            hotel={hotels[selectedHotelId]}
            onLogin={(user) => {
              setCurrentUser(user);
              setScreen('app');
            }}
            onBack={() => {
              setSelectedHotelId(null);
              setScreen('home');
            }}
          />
        );
      }

      return (
        <HomeScreen 
          hotels={hotels}
          onSelectHotel={(id) => {
            setSelectedHotelId(id);
            setScreen('login');
          }}
          onOpenAdmin={() => setScreen('admin')}
        />
      );
    }

    // ==================== HOME SCREEN ====================
    function HomeScreen({ hotels, onSelectHotel, onOpenAdmin }) {
      const [showPin, setShowPin] = useState(false);
      const [pin, setPin] = useState('');

      const handlePin = (d) => {
        const newPin = pin + d;
        setPin(newPin);
        if (newPin.length === 4) {
          if (newPin === SUPER_ADMIN_PIN) {
            setShowPin(false);
            setPin('');
            onOpenAdmin();
          } else {
            setPin('');
          }
        }
      };

      const hotelList = Object.entries(hotels);

      return (
        <div className="min-h-screen bg-gradient-to-br from-emerald-600 to-teal-700 p-6">
          <div className="text-center mb-8">
            <div className="inline-block bg-white rounded-xl px-6 py-3 mb-4">
              <div className="text-emerald-600 font-bold">TOP ECO</div>
              <div className="text-2xl font-black text-slate-800">PRO</div>
            </div>
            <h1 className="text-2xl font-bold text-white">Housekeeping</h1>
            <p className="text-white/70">Wählen Sie Ihr Hotel</p>
          </div>

          <div className="max-w-md mx-auto space-y-3">
            {hotelList.length === 0 ? (
              <div className="bg-white/20 rounded-2xl p-8 text-center text-white">
                <p className="text-xl mb-2">🏨</p>
                <p>Keine Hotels</p>
                <p className="text-sm text-white/60 mt-2">Admin → Hotel hinzufügen</p>
              </div>
            ) : (
              hotelList.map(([id, hotel]) => (
                <button
                  key={id}
                  onClick={() => onSelectHotel(id)}
                  className="w-full bg-white/20 text-white p-4 rounded-2xl flex items-center gap-4 text-left"
                >
                  <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">🏨</div>
                  <div className="flex-1">
                    <div className="font-semibold">{hotel.name}</div>
                    <div className="text-sm text-white/70">{Object.keys(hotel.rooms || {}).length} Zimmer</div>
                  </div>
                  <div className="text-white/50">→</div>
                </button>
              ))
            )}
          </div>

          <div className="mt-8 text-center">
            <button onClick={() => setShowPin(true)} className="text-white/50 text-sm">
              TopEcoX Admin
            </button>
          </div>

          {showPin && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-xs">
                <div className="flex justify-between mb-4">
                  <span className="font-semibold">Admin PIN</span>
                  <button onClick={() => {setShowPin(false); setPin('');}}>✕</button>
                </div>
                <div className="flex justify-center gap-2 mb-4">
                  {[0,1,2,3].map(i => (
                    <div key={i} className={`w-4 h-4 rounded-full ${i < pin.length ? 'bg-emerald-500' : 'bg-slate-200'}`}/>
                  ))}
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {[1,2,3,4,5,6,7,8,9,null,0,'←'].map((d,i) => (
                    <button
                      key={i}
                      onClick={() => d === '←' ? setPin(pin.slice(0,-1)) : d !== null && handlePin(String(d))}
                      className={`h-12 rounded-xl font-bold ${d === null ? 'invisible' : 'bg-slate-100'}`}
                    >
                      {d}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== SUPER ADMIN ====================
    function SuperAdmin({ hotels, onBack }) {
      const [view, setView] = useState('list');
      const [editHotel, setEditHotel] = useState(null);

      const deleteHotel = (id) => {
        if (confirm('Hotel löschen?')) {
          database.ref('hotels/' + id).remove();
        }
      };

      if (view === 'form') {
        return (
          <HotelForm 
            hotel={editHotel}
            onSave={() => {
              setView('list');
              setEditHotel(null);
            }}
            onCancel={() => {
              setView('list');
              setEditHotel(null);
            }}
          />
        );
      }

      const hotelList = Object.entries(hotels);

      return (
        <div className="min-h-screen bg-slate-100">
          <div className="bg-slate-800 text-white p-6 pt-12">
            <button onClick={onBack} className="text-white/70 mb-4">← Zurück</button>
            <h1 className="text-2xl font-bold">Admin Dashboard</h1>
          </div>

          <div className="p-4 space-y-4">
            <button
              onClick={() => setView('form')}
              className="w-full bg-emerald-500 text-white py-4 rounded-2xl font-semibold"
            >
              + Hotel hinzufügen
            </button>

            {hotelList.map(([id, hotel]) => (
              <div key={id} className="bg-white rounded-2xl p-4 flex items-center gap-4">
                <div className="flex-1">
                  <div className="font-semibold">{hotel.name}</div>
                  <div className="text-sm text-slate-500">{Object.keys(hotel.rooms || {}).length} Zimmer</div>
                </div>
                <button 
                  onClick={() => { setEditHotel({id, ...hotel}); setView('form'); }}
                  className="p-2 bg-slate-100 rounded-lg"
                >✏️</button>
                <button 
                  onClick={() => deleteHotel(id)}
                  className="p-2 bg-red-100 rounded-lg text-red-600"
                >🗑️</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==================== HOTEL FORM ====================
    function HotelForm({ hotel, onSave, onCancel }) {
      const [name, setName] = useState(hotel?.name || '');
      const [floorsText, setFloorsText] = useState('');
      const [hausdamePin, setHausdamePin] = useState(hotel?.hausdamePin || '0000');
      const [hkCount, setHkCount] = useState(hotel?.staff?.filter(s => s.role === 'housekeeper').length || 5);

      const save = () => {
        if (!name) return alert('Bitte Name eingeben');
        
        const id = hotel?.id || 'hotel_' + Date.now();
        
        // Parse floors: "1:101-115,117 2:201-225"
        const rooms = {};
        const floorNumbers = [];
        
        if (floorsText) {
          floorsText.split(' ').forEach(part => {
            const [floor, roomsPart] = part.split(':');
            if (floor && roomsPart) {
              const floorNum = parseInt(floor);
              floorNumbers.push(floorNum);
              
              roomsPart.split(',').forEach(r => {
                if (r.includes('-')) {
                  const [start, end] = r.split('-').map(n => parseInt(n));
                  for (let i = start; i <= end; i++) {
                    rooms[i] = {
                      id: i, number: String(i), floor: floorNum,
                      status: 'pending', guestStatus: 'none', anreise: false,
                      inspected: false, problems: [], photos: [],
                      minibar: {water:{consumed:0,price:2},cola:{consumed:0,price:3},beer:{consumed:0,price:5}}
                    };
                  }
                } else {
                  const num = parseInt(r);
                  rooms[num] = {
                    id: num, number: String(num), floor: floorNum,
                    status: 'pending', guestStatus: 'none', anreise: false,
                    inspected: false, problems: [], photos: [],
                    minibar: {water:{consumed:0,price:2},cola:{consumed:0,price:3},beer:{consumed:0,price:5}}
                  };
                }
              });
            }
          });
        }

        // Staff
        const staff = [
          { id: 'hausdame', name: 'Hausdame', pin: hausdamePin, role: 'admin', floors: floorNumbers }
        ];
        
        for (let i = 1; i <= hkCount; i++) {
          staff.push({
            id: 'hk' + i,
            name: 'Housekeeping ' + i,
            pin: String(i).repeat(4),
            role: 'housekeeper',
            floors: []
          });
        }

        database.ref('hotels/' + id).set({
          name,
          hausdamePin,
          staff,
          rooms: Object.keys(rooms).length > 0 ? rooms : (hotel?.rooms || {})
        });

        onSave();
      };

      return (
        <div className="min-h-screen bg-slate-100">
          <div className="bg-slate-800 text-white p-6 pt-12">
            <button onClick={onCancel} className="text-white/70 mb-4">← Abbrechen</button>
            <h1 className="text-2xl font-bold">{hotel ? 'Hotel bearbeiten' : 'Neues Hotel'}</h1>
          </div>

          <div className="p-4 space-y-4">
            <div className="bg-white rounded-2xl p-4">
              <label className="block text-sm text-slate-500 mb-2">Hotelname</label>
              <input
                value={name}
                onChange={e => setName(e.target.value)}
                placeholder="z.B. ibis Bregenz"
                className="w-full p-3 bg-slate-100 rounded-xl"
              />
            </div>

            <div className="bg-white rounded-2xl p-4">
              <label className="block text-sm text-slate-500 mb-2">Etagen & Zimmer</label>
              <textarea
                value={floorsText}
                onChange={e => setFloorsText(e.target.value)}
                placeholder="1:101-115,117 2:201-225 3:301-325"
                className="w-full p-3 bg-slate-100 rounded-xl h-24"
              />
              <p className="text-xs text-slate-400 mt-2">Format: Stock:Zimmer Stock:Zimmer (z.B. 1:101-115,117 2:201-225)</p>
            </div>

            <div className="bg-white rounded-2xl p-4">
              <label className="block text-sm text-slate-500 mb-2">Hausdame PIN</label>
              <input
                value={hausdamePin}
                onChange={e => setHausdamePin(e.target.value.slice(0,4))}
                maxLength={4}
                className="w-24 p-3 bg-slate-100 rounded-xl text-center font-mono"
              />
            </div>

            <div className="bg-white rounded-2xl p-4">
              <label className="block text-sm text-slate-500 mb-2">Housekeeping Anzahl</label>
              <input
                type="number"
                value={hkCount}
                onChange={e => setHkCount(parseInt(e.target.value) || 1)}
                min={1}
                max={10}
                className="w-24 p-3 bg-slate-100 rounded-xl text-center"
              />
              <p className="text-xs text-slate-400 mt-2">PINs: 1111, 2222, 3333...</p>
            </div>

            <button onClick={save} className="w-full bg-emerald-500 text-white py-4 rounded-2xl font-semibold">
              Speichern
            </button>
          </div>
        </div>
      );
    }

    // ==================== HOTEL LOGIN ====================
    function HotelLogin({ hotel, onLogin, onBack }) {
      const [selectedId, setSelectedId] = useState(null);
      const [pin, setPin] = useState('');
      const [error, setError] = useState(false);

      const handlePin = (d) => {
        const newPin = pin + d;
        setPin(newPin);
        setError(false);
        
        if (newPin.length === 4) {
          const user = hotel.staff?.find(s => s.id === selectedId && s.pin === newPin);
          if (user) {
            onLogin(user);
          } else {
            setError(true);
            setTimeout(() => setPin(''), 500);
          }
        }
      };

      if (!selectedId) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-sky-600 to-purple-700 p-6">
            <button onClick={onBack} className="text-white/70 mb-8">← Zurück</button>
            
            <div className="text-center mb-8">
              <h1 className="text-2xl font-bold text-white">{hotel.name}</h1>
              <p className="text-white/70">Wählen Sie Ihren Namen</p>
            </div>

            <div className="max-w-sm mx-auto space-y-3">
              {hotel.staff?.map(s => (
                <button
                  key={s.id}
                  onClick={() => setSelectedId(s.id)}
                  className="w-full bg-white/20 text-white p-4 rounded-2xl flex items-center gap-4"
                >
                  <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold ${s.role === 'admin' ? 'bg-purple-500' : 'bg-sky-500'}`}>
                    {s.name[0]}
                  </div>
                  <div className="flex-1 text-left">
                    <div className="font-semibold">{s.name}</div>
                    <div className="text-sm text-white/60">{s.role === 'admin' ? 'Admin' : 'Housekeeping'}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        );
      }

      const user = hotel.staff?.find(s => s.id === selectedId);

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-600 to-purple-700 flex flex-col items-center justify-center p-6">
          <button onClick={() => {setSelectedId(null); setPin('');}} className="absolute top-6 left-6 text-white/70">← Zurück</button>
          
          <div className={`w-20 h-20 rounded-full flex items-center justify-center text-3xl font-bold text-white mb-4 ${user?.role === 'admin' ? 'bg-purple-500' : 'bg-sky-500'}`}>
            {user?.name[0]}
          </div>
          <h2 className="text-xl font-bold text-white mb-6">{user?.name}</h2>

          <div className="flex gap-2 mb-4">
            {[0,1,2,3].map(i => (
              <div key={i} className={`w-4 h-4 rounded-full ${error ? 'bg-red-400' : i < pin.length ? 'bg-white' : 'bg-white/30'}`}/>
            ))}
          </div>

          <div className="grid grid-cols-3 gap-3 w-64">
            {[1,2,3,4,5,6,7,8,9,null,0,'←'].map((d,i) => (
              <button
                key={i}
                onClick={() => d === '←' ? setPin(pin.slice(0,-1)) : d !== null && handlePin(String(d))}
                className={`h-14 rounded-2xl font-bold text-xl ${d === null ? 'invisible' : 'bg-white/20 text-white'}`}
              >
                {d}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ==================== HOTEL APP ====================
    function HotelApp({ hotel, hotelId, user, onLogout }) {
      const [rooms, setRooms] = useState(hotel.rooms || {});
      const [selectedRoom, setSelectedRoom] = useState(null);
      const [filterFloor, setFilterFloor] = useState(0);

      useEffect(() => {
        const ref = database.ref('hotels/' + hotelId + '/rooms');
        ref.on('value', snap => {
          if (snap.val()) setRooms(snap.val());
        });
        return () => ref.off();
      }, [hotelId]);

      const updateRoom = (roomId, updates) => {
        database.ref('hotels/' + hotelId + '/rooms/' + roomId).update(updates);
      };

      const isAdmin = user.role === 'admin';
      const roomList = Object.values(rooms).sort((a,b) => a.id - b.id);
      const floors = [...new Set(roomList.map(r => r.floor))].sort((a,b) => a - b);
      const filtered = filterFloor === 0 ? roomList : roomList.filter(r => r.floor === filterFloor);

      const stats = {
        total: roomList.length,
        clean: roomList.filter(r => r.status === 'clean' && !r.inspected).length,
        inspected: roomList.filter(r => r.inspected).length,
        pending: roomList.filter(r => r.status === 'pending').length
      };

      if (selectedRoom) {
        const room = rooms[selectedRoom.id] || selectedRoom;
        return (
          <RoomDetail 
            room={room}
            user={user}
            onBack={() => setSelectedRoom(null)}
            onUpdate={(updates) => updateRoom(room.id, updates)}
          />
        );
      }

      return (
        <div className="min-h-screen bg-slate-100">
          <div className={`${isAdmin ? 'bg-purple-600' : 'bg-sky-600'} text-white p-4 pt-10`}>
            <div className="flex justify-between items-start mb-4">
              <div>
                <div className="text-lg font-bold">{hotel.name}</div>
                <div className="text-white/70 text-sm">{user.name}</div>
              </div>
              <button onClick={onLogout} className="p-2 bg-white/20 rounded-full">↩</button>
            </div>

            <div className="grid grid-cols-4 gap-2">
              <div className="bg-white/20 rounded-xl p-2 text-center">
                <div className="text-xl font-bold">{stats.inspected}</div>
                <div className="text-xs text-white/70">Geprüft</div>
              </div>
              <div className="bg-white/20 rounded-xl p-2 text-center">
                <div className="text-xl font-bold">{stats.clean}</div>
                <div className="text-xs text-white/70">Sauber</div>
              </div>
              <div className="bg-white/20 rounded-xl p-2 text-center">
                <div className="text-xl font-bold">{stats.pending}</div>
                <div className="text-xs text-white/70">Offen</div>
              </div>
              <div className="bg-white/20 rounded-xl p-2 text-center">
                <div className="text-xl font-bold">{stats.total}</div>
                <div className="text-xs text-white/70">Gesamt</div>
              </div>
            </div>
          </div>

          <div className="flex gap-2 p-3 bg-white border-b overflow-x-auto">
            <button
              onClick={() => setFilterFloor(0)}
              className={`px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap ${filterFloor === 0 ? 'bg-sky-600 text-white' : 'bg-slate-100'}`}
            >
              Alle
            </button>
            {floors.map(f => (
              <button
                key={f}
                onClick={() => setFilterFloor(f)}
                className={`px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap ${filterFloor === f ? 'bg-sky-600 text-white' : 'bg-slate-100'}`}
              >
                {f}. Stock
              </button>
            ))}
          </div>

          <div className="p-3 space-y-2 pb-24">
            {filtered.map(room => {
              const bgColor = room.inspected ? 'bg-emerald-50 border-emerald-300' 
                : room.status === 'clean' ? 'bg-amber-50 border-amber-300'
                : 'bg-white border-slate-100';
              
              const statusColor = room.inspected ? 'bg-emerald-500' 
                : room.status === 'clean' ? 'bg-amber-400'
                : room.status === 'in_progress' ? 'bg-orange-400'
                : 'bg-slate-300';

              return (
                <div key={room.id} className={`rounded-2xl p-3 border ${bgColor}`}>
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setSelectedRoom(room)}
                      className={`w-12 h-12 rounded-xl ${statusColor} flex items-center justify-center text-white font-bold`}
                    >
                      {room.number}
                    </button>

                    {isAdmin ? (
                      <div className="flex-1">
                        <div className="flex gap-1 mb-1 flex-wrap">
                          {[
                            {key:'abreise',label:'AB',color:'bg-red-500'},
                            {key:'bleibe',label:'BL',color:'bg-blue-500'},
                            {key:'bb',label:'BB',color:'bg-purple-500'},
                            {key:'kontrolle',label:'K',color:'bg-orange-500'}
                          ].map(btn => (
                            <button
                              key={btn.key}
                              onClick={() => {
                                const newGs = room.guestStatus === btn.key ? 'none' : btn.key;
                                const newAn = newGs === 'abreise' ? true : false;
                                updateRoom(room.id, { guestStatus: newGs, anreise: newAn });
                              }}
                              className={`w-9 h-9 rounded-lg text-xs font-bold ${room.guestStatus === btn.key ? btn.color + ' text-white' : 'bg-slate-200 text-slate-500'}`}
                            >
                              {btn.label}
                            </button>
                          ))}
                          {room.guestStatus === 'abreise' && (
                            <button
                              onClick={() => updateRoom(room.id, { anreise: !room.anreise })}
                              className={`w-9 h-9 rounded-lg text-xs font-bold ${room.anreise ? 'bg-green-500 text-white' : 'bg-white text-slate-400 border-2 border-dashed border-slate-300'}`}
                            >
                              AN
                            </button>
                          )}
                          {room.status === 'clean' && !room.inspected && (
                            <button
                              onClick={() => updateRoom(room.id, { inspected: true })}
                              className="w-9 h-9 rounded-lg text-xs font-bold bg-emerald-500 text-white ml-1"
                            >
                              ✓✓
                            </button>
                          )}
                        </div>
                        <div className="text-xs text-slate-500">
                          {room.inspected ? 'Geprüft ✓✓' : room.status === 'clean' ? 'Sauber ✓' : 'Offen'}
                        </div>
                      </div>
                    ) : (
                      <button onClick={() => setSelectedRoom(room)} className="flex-1 text-left">
                        <div className="font-semibold">Zimmer {room.number}</div>
                        <div className="text-sm text-slate-500">
                          {room.inspected ? 'Geprüft ✓✓' : room.status === 'clean' ? 'Sauber ✓' : 'Offen'}
                        </div>
                      </button>
                    )}

                    <button onClick={() => setSelectedRoom(room)} className="text-slate-400">→</button>
                  </div>
                </div>
              );
            })}
          </div>

          {isAdmin && (
            <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t">
              <button
                onClick={() => {
                  if (confirm('Alle Zimmer zurücksetzen?')) {
                    const reset = {};
                    Object.values(rooms).forEach(r => {
                      reset[r.id] = { ...r, status: 'pending', guestStatus: 'none', anreise: false, inspected: false };
                    });
                    database.ref('hotels/' + hotelId + '/rooms').set(reset);
                  }
                }}
                className="w-full bg-red-500 text-white py-3 rounded-xl font-semibold"
              >
                🔄 Neuer Tag - Reset
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==================== ROOM DETAIL ====================
    function RoomDetail({ room, user, onBack, onUpdate }) {
      const isAdmin = user.role === 'admin';

      const statusColor = room.inspected ? 'bg-emerald-500' 
        : room.status === 'clean' ? 'bg-amber-400'
        : room.status === 'in_progress' ? 'bg-orange-400'
        : 'bg-slate-400';

      return (
        <div className="min-h-screen bg-slate-100">
          <div className={`${statusColor} text-white p-4 pt-10`}>
            <button onClick={onBack} className="text-white/80 mb-4">← Zurück</button>
            <h1 className="text-3xl font-bold">Zimmer {room.number}</h1>
            <p className="text-white/80">{room.floor}. Stock</p>
          </div>

          <div className="p-4 space-y-4">
            {isAdmin && (
              <div className="bg-white rounded-2xl p-4">
                <div className="text-sm text-slate-500 mb-2">Gast Status</div>
                <div className="grid grid-cols-5 gap-2">
                  {[
                    {key:'none',label:'Keine',color:'bg-slate-200 text-slate-700'},
                    {key:'abreise',label:'Abreise',color:'bg-red-100 text-red-700'},
                    {key:'bleibe',label:'Bleibe',color:'bg-blue-100 text-blue-700'},
                    {key:'bb',label:'BB',color:'bg-purple-100 text-purple-700'},
                    {key:'kontrolle',label:'Kontrolle',color:'bg-orange-100 text-orange-700'}
                  ].map(btn => (
                    <button
                      key={btn.key}
                      onClick={() => {
                        const newAn = btn.key === 'abreise' ? true : false;
                        onUpdate({ guestStatus: btn.key, anreise: newAn });
                      }}
                      className={`py-2 rounded-xl text-xs font-medium ${room.guestStatus === btn.key ? btn.color + ' ring-2 ring-offset-1' : 'bg-slate-100 text-slate-500'}`}
                    >
                      {btn.label}
                    </button>
                  ))}
                </div>
                
                {room.guestStatus === 'abreise' && (
                  <div className="mt-3 flex items-center gap-3">
                    <span className="text-sm text-slate-500">Anreise:</span>
                    <button
                      onClick={() => onUpdate({ anreise: !room.anreise })}
                      className={`px-4 py-2 rounded-xl font-bold ${room.anreise ? 'bg-green-500 text-white' : 'bg-white border-2 border-dashed border-slate-300 text-slate-400'}`}
                    >
                      {room.anreise ? 'AN ✓' : 'Leer'}
                    </button>
                  </div>
                )}
              </div>
            )}

            <div className="bg-white rounded-2xl p-4">
              <div className="text-sm text-slate-500 mb-2">Reinigung</div>
              <div className="grid grid-cols-4 gap-2">
                {[
                  {key:'pending',label:'Offen'},
                  {key:'in_progress',label:'In Arbeit'},
                  {key:'clean',label:'Sauber'},
                  {key:'skipped',label:'Skip'}
                ].map(s => (
                  <button
                    key={s.key}
                    onClick={() => onUpdate({ status: s.key, inspected: false })}
                    className={`py-3 rounded-xl text-xs font-medium ${room.status === s.key && !room.inspected ? 'bg-amber-100 text-amber-700 ring-2 ring-amber-400' : 'bg-slate-100 text-slate-500'}`}
                  >
                    {s.label}
                  </button>
                ))}
              </div>
            </div>

            {isAdmin && room.status === 'clean' && (
              <button
                onClick={() => onUpdate({ inspected: !room.inspected })}
                className={`w-full py-4 rounded-xl font-semibold ${room.inspected ? 'bg-emerald-600 text-white' : 'bg-emerald-100 text-emerald-700 border-2 border-emerald-400'}`}
              >
                {room.inspected ? '✓✓ Geprüft' : 'Als Geprüft markieren'}
              </button>
            )}

            {!isAdmin && room.status !== 'clean' && (
              <button
                onClick={() => onUpdate({ status: 'clean' })}
                className="w-full bg-amber-400 text-slate-800 py-4 rounded-xl font-semibold text-lg"
              >
                ✓ Sauber
              </button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
